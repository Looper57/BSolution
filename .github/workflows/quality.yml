name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    # Ubicloud managed runner (owner 2026-10-29, cost). To fall back, set ubuntu-latest.
    runs-on: ubicloud-standard-2
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Technical-SEO graph crawl gate (2026-08-22 Ahrefs audit) — crawls
      # the complete authoritative inventory (app/sitemap.ts's own output)
      # plus every first-party link discovered on it, against the just-built
      # .next output, and fails the job on any broken/redirecting hreflang,
      # missing reciprocity, invalid canonical, internal link to a noindex
      # non-navigable page, unclean 404, or unexplained URL expansion.
      - name: Technical SEO graph crawl
        run: pnpm graph-crawl:gate

      - name: Upload graph crawl report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: graph-crawl-report
          path: artifacts/graph-crawl-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e

      - name: Upload responsive hero proof
        uses: actions/upload-artifact@v6
        with:
          name: responsive-hero-proof
          path: artifacts/responsive-hero-proof.json
          if-no-files-found: error
          retention-days: 7

      # This dummy public key exists only in the CI build. Provider script and
      # contact responses are intercepted; production keys/server verification stay intact.
      - name: Install synthetic calendar fixture for browser verification
        run: pnpm exec tsx scripts/ci/editorial-calendar-fixture.mts

      - name: Build widget-enabled browser fixture
        run: pnpm build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Widget lifecycle browser tests
        run: pnpm exec playwright test --config playwright.challenge.config.ts

      - name: Editorial calendar fixture browser test
        run: pnpm exec playwright test --config playwright.calendar.config.ts

      - name: Retain calendar browser proof
        uses: actions/upload-artifact@v6
        with:
          name: editorial-calendar-fixture-proof
          path: artifacts/editorial-calendar-fixture-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            test-results-challenge/
            test-results-calendar/
          if-no-files-found: ignore
          retention-days: 7
