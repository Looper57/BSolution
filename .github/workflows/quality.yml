name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Technical-SEO graph crawl gate (2026-08-22 Ahrefs audit) — crawls
      # the complete authoritative inventory (app/sitemap.ts's own output)
      # plus every first-party link discovered on it, against the just-built
      # .next output, and fails the job on any broken/redirecting hreflang,
      # missing reciprocity, invalid canonical, internal link to a noindex
      # non-navigable page, unclean 404, or unexplained URL expansion.
      - name: Technical SEO graph crawl
        run: pnpm graph-crawl:gate

      - name: Upload graph crawl report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: graph-crawl-report
          path: artifacts/graph-crawl-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
